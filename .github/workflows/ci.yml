name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-runtime:
    name: Web and tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run Windows Activity release launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set UE5_ACTIVITY_NO_PAUSE=1
          UE5HTML5Exporter\Resources\WebTemplate\release-discord-activity.cmd --help
      - name: Run Windows Discord preview launcher check
        if: runner.os == 'Windows'
        shell: cmd
        run: UE5HTML5Exporter\Resources\WebTemplate\preview-discord-activity.cmd --check
      - name: Run Windows browser certification launcher check
        if: runner.os == 'Windows'
        shell: cmd
        run: UE5HTML5Exporter\Resources\WebTemplate\certify-browser.cmd --check
      - name: Run Windows plugin installer launcher check
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\Install-UE5HTML5Exporter.cmd --check
      - name: Run macOS Activity release launcher
        if: runner.os == 'macOS'
        shell: bash
        run: printf '\n' | UE5HTML5Exporter/Resources/WebTemplate/release-discord-activity.command --help
      - name: Run macOS Discord preview launcher check
        if: runner.os == 'macOS'
        shell: bash
        run: UE5HTML5Exporter/Resources/WebTemplate/preview-discord-activity.command --check
      - name: Run macOS browser certification launcher check
        if: runner.os == 'macOS'
        shell: bash
        run: UE5HTML5Exporter/Resources/WebTemplate/certify-browser.command --check
      - name: Run Linux Activity release launcher
        if: runner.os == 'Linux'
        shell: bash
        run: UE5_ACTIVITY_NO_PAUSE=1 UE5HTML5Exporter/Resources/WebTemplate/release-discord-activity.sh --help
      - name: Run Linux Discord preview launcher check
        if: runner.os == 'Linux'
        shell: bash
        run: UE5HTML5Exporter/Resources/WebTemplate/preview-discord-activity.sh --check
      - name: Run Linux browser certification launcher check
        if: runner.os == 'Linux'
        shell: bash
        run: UE5HTML5Exporter/Resources/WebTemplate/certify-browser.sh --check
      - name: Create source teammate bundle
        if: runner.os == 'Linux'
        run: npm run package:source -- --output "$RUNNER_TEMP/UE5HTML5Exporter-Source"
      - name: Upload source teammate bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: UE5HTML5Exporter-Source
          path: ${{ runner.temp }}/UE5HTML5Exporter-Source
          if-no-files-found: error
      - name: Parse Windows PowerShell helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($script in @('UE5HTML5Tools.psm1', 'Start-UE5HTML5Setup.ps1', 'Start-UE5HTML5Certification.ps1', 'Setup-UE5HTML5Exporter.ps1', 'Install-UE5HTML5Exporter.ps1', 'Package-UE5HTML5Exporter.ps1', 'Verify-UE5HTML5Exporter.ps1', 'Test-WindowsTooling.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\$script", [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += $parseErrors
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\UE5HTML5Exporter\Resources\WebTemplate\scripts\Start-DiscordActivityRelease.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          $allErrors += $parseErrors
          if ($allErrors.Count) { $allErrors | Format-List | Out-String | Write-Error }
      - name: Bootstrap verified portable Windows release runtime
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bootstrap = "$PWD\UE5HTML5Exporter\Resources\WebTemplate\scripts\Start-DiscordActivityRelease.ps1"
          $pathFile = "$env:RUNNER_TEMP\ue5html5-portable-node.txt"
          $reportFile = "$env:RUNNER_TEMP\ue5html5-portable-node.json"
          $cacheRoot = "$env:RUNNER_TEMP\ue5html5-portable-node-cache"
          & $bootstrap -PathFile $pathFile -ReportFile $reportFile -ForcePortableNode -CacheRoot $cacheRoot
          $node = Get-Content -LiteralPath $pathFile -Raw
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { throw "Portable Node executable was not created: $node" }
          $version = (& $node --version).Trim()
          if ($version -ne 'v22.23.2') { throw "Portable Node version mismatch: $version" }
          $download = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json
          if ($download.schema -ne 'ue5-html5-node-resolution/v1' -or
              $download.source -ne 'verified-portable-download' -or
              $download.checksumVerified -ne $true -or
              $download.executableSha256 -ne '0d0f5e39f9f3d9587bc19f73eab3c2c9c4903fd02d6dbf9c853dd81b3d95fad4' -or
              $download.administratorRequired -ne $false -or
              $download.systemPathChanged -ne $false) {
            throw "Portable Node download evidence is invalid: $($download | ConvertTo-Json -Compress)"
          }
          $runtimeManifestPath = Join-Path (Split-Path -Parent $node) 'ue5html5-node-runtime.json'
          $runtimeManifest = Get-Content -LiteralPath $runtimeManifestPath -Raw | ConvertFrom-Json
          $actualExecutableHash = (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeManifest.executableSha256 -ne $actualExecutableHash) {
            throw 'Portable Node executable does not match its verified runtime manifest.'
          }
          $cachedPathFile = "$env:RUNNER_TEMP\ue5html5-portable-node-cached.txt"
          $cachedReportFile = "$env:RUNNER_TEMP\ue5html5-portable-node-cached.json"
          & $bootstrap -PathFile $cachedPathFile -ReportFile $cachedReportFile -ForcePortableNode -CacheRoot $cacheRoot
          $cached = Get-Content -LiteralPath $cachedReportFile -Raw | ConvertFrom-Json
          if ($cached.source -ne 'verified-portable-cache' -or $cached.checksumVerified -ne $true) {
            throw "Portable Node cache evidence is invalid: $($cached | ConvertTo-Json -Compress)"
          }
          $runtimeManifest.executableSha256 = '0' * 64
          $runtimeManifest | ConvertTo-Json | Set-Content -LiteralPath $runtimeManifestPath -Encoding utf8
          $repairPathFile = "$env:RUNNER_TEMP\ue5html5-portable-node-repaired.txt"
          $repairReportFile = "$env:RUNNER_TEMP\ue5html5-portable-node-repaired.json"
          & $bootstrap -PathFile $repairPathFile -ReportFile $repairReportFile -ForcePortableNode -CacheRoot $cacheRoot
          $repaired = Get-Content -LiteralPath $repairReportFile -Raw | ConvertFrom-Json
          if ($repaired.source -ne 'verified-portable-download' -or
              $repaired.executableSha256 -ne '0d0f5e39f9f3d9587bc19f73eab3c2c9c4903fd02d6dbf9c853dd81b3d95fad4') {
            throw "Portable Node cache repair evidence is invalid: $($repaired | ConvertTo-Json -Compress)"
          }
          $backupRoot = Join-Path $cacheRoot 'v22.23.2'
          $backups = @(Get-ChildItem -LiteralPath $backupRoot -Directory -Filter 'x64.backup-*')
          if ($backups.Count -ne 1) { throw "Portable Node cache repair did not retain exactly one backup; found $($backups.Count)." }
          Write-Host "Verified portable Windows release runtime: $version at $node"
      - name: Run Windows workstation contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\Test-WindowsTooling.ps1
      - name: Run Windows PowerShell 5.1 compatibility tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\Test-WindowsTooling.ps1
