name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-runtime:
    name: Web and tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create source teammate bundle
        if: runner.os == 'Linux'
        run: npm run package:source -- --output "$RUNNER_TEMP/UE5HTML5Exporter-Source"
      - name: Upload source teammate bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: UE5HTML5Exporter-Source
          path: ${{ runner.temp }}/UE5HTML5Exporter-Source
          if-no-files-found: error
      - name: Parse Windows PowerShell helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($script in @('Install-UE5HTML5Exporter.ps1', 'Package-UE5HTML5Exporter.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\$script", [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) { $allErrors | Format-List | Out-String | Write-Error }
