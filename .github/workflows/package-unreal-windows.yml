name: Package Unreal Plugin for Windows

on:
  workflow_dispatch:
    inputs:
      engine_root:
        description: Optional Unreal Engine root; blank auto-discovers the newest Epic Launcher install
        required: false
        default: ''
      project_path:
        description: Optional .uproject path on the runner for full export certification
        required: false
        default: ''
      map_path:
        description: Unreal /Game map path used when project_path is supplied
        required: false
        default: /Game/FirstPerson/Lvl_FirstPerson

permissions:
  contents: read

jobs:
  package-win64:
    runs-on: [self-hosted, Windows, ue5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check Windows Unreal workstation
        shell: pwsh
        env:
          UE_ENGINE_ROOT: ${{ inputs.engine_root }}
          UE_PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          $arguments = @{ RequireVisualStudio = $true; RequireNode = $true }
          if ($env:UE_ENGINE_ROOT) { $arguments.EngineRoot = $env:UE_ENGINE_ROOT }
          if ($env:UE_PROJECT_PATH) {
            $project = Get-Content -LiteralPath $env:UE_PROJECT_PATH -Raw | ConvertFrom-Json
            if ($project.EngineAssociation) { $arguments.EngineAssociation = [string]$project.EngineAssociation }
          }
          Import-Module .\scripts\UE5HTML5Tools.psm1 -Force
          $report = Get-UE5HTML5WorkstationReport @arguments
          $report | ConvertTo-Json -Depth 6
          if (-not $report.ready) { throw "Windows workstation is not ready: $($report.blockers -join '; ')" }
      - name: Build Win64 Unreal plugin
        if: inputs.project_path == ''
        shell: pwsh
        env:
          UE_ENGINE_ROOT: ${{ inputs.engine_root }}
        run: |
          $arguments = @{
            Platform = 'Win64'
            Output = "$env:RUNNER_TEMP\UE5HTML5Exporter-Win64-$env:GITHUB_RUN_ID"
          }
          if ($env:UE_ENGINE_ROOT) { $arguments.EngineRoot = $env:UE_ENGINE_ROOT }
          .\scripts\Package-UE5HTML5Exporter.ps1 @arguments
      - name: Certify Win64 plugin with a real Unreal project export
        if: inputs.project_path != ''
        shell: pwsh
        env:
          UE_ENGINE_ROOT: ${{ inputs.engine_root }}
          UE_PROJECT_PATH: ${{ inputs.project_path }}
          UE_MAP_PATH: ${{ inputs.map_path }}
        run: |
          $arguments = @{
            Project = $env:UE_PROJECT_PATH
            Map = $env:UE_MAP_PATH
            PackageOutput = "$env:RUNNER_TEMP\UE5HTML5Exporter-Win64-$env:GITHUB_RUN_ID"
            ExportOutput = "$env:RUNNER_TEMP\UE5HTML5Exporter-Certified-Export-$env:GITHUB_RUN_ID"
          }
          if ($env:UE_ENGINE_ROOT) { $arguments.EngineRoot = $env:UE_ENGINE_ROOT }
          .\scripts\Verify-UE5HTML5Exporter.ps1 @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: UE5HTML5Exporter-Win64
          path: ${{ runner.temp }}\UE5HTML5Exporter-Win64-${{ github.run_id }}
          if-no-files-found: error
      - name: Upload certified Unreal export
        if: inputs.project_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: UE5HTML5Exporter-Certified-Export
          path: ${{ runner.temp }}\UE5HTML5Exporter-Certified-Export-${{ github.run_id }}
          if-no-files-found: error
