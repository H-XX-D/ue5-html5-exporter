name: Package Unreal Plugin for Windows

on:
  workflow_dispatch:
    inputs:
      engine_root:
        description: Unreal Engine root on the self-hosted Windows runner
        required: true
        default: C:\Program Files\Epic Games\UE_5.8
      project_path:
        description: Optional .uproject path on the runner for full export certification
        required: false
        default: ''
      map_path:
        description: Unreal /Game map path used when project_path is supplied
        required: false
        default: /Game/FirstPerson/Lvl_FirstPerson

permissions:
  contents: read

jobs:
  package-win64:
    runs-on: [self-hosted, Windows, ue5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Win64 Unreal plugin
        if: inputs.project_path == ''
        shell: pwsh
        run: npm run package:plugin -- --engine "${{ inputs.engine_root }}" --platform Win64 --output "$env:RUNNER_TEMP\UE5HTML5Exporter-Win64-$env:GITHUB_RUN_ID"
      - name: Certify Win64 plugin with a real Unreal project export
        if: inputs.project_path != ''
        shell: pwsh
        run: >-
          .\scripts\Verify-UE5HTML5Exporter.ps1
          -EngineRoot "${{ inputs.engine_root }}"
          -Project "${{ inputs.project_path }}"
          -Map "${{ inputs.map_path }}"
          -PackageOutput "$env:RUNNER_TEMP\UE5HTML5Exporter-Win64-$env:GITHUB_RUN_ID"
          -ExportOutput "$env:RUNNER_TEMP\UE5HTML5Exporter-Certified-Export-$env:GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: UE5HTML5Exporter-Win64
          path: ${{ runner.temp }}\UE5HTML5Exporter-Win64-${{ github.run_id }}
          if-no-files-found: error
      - name: Upload certified Unreal export
        if: inputs.project_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: UE5HTML5Exporter-Certified-Export
          path: ${{ runner.temp }}\UE5HTML5Exporter-Certified-Export-${{ github.run_id }}
          if-no-files-found: error
